<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Ease</title>
<style>
  :root { --ink: #23303a; --muted: #5b6770; --bg: #f7efe0; --card: #fffaf0; --teal: #1f6f78; --red: #d64933; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 2rem; }
  .lead { margin: 0 0 28px; color: var(--muted); }
  .game { display: flex; gap: 18px; align-items: center; background: var(--card); border: 1px solid #e3d6bd; border-radius: 16px; padding: 18px; }
  .game img { width: 96px; height: 96px; border-radius: 22px; flex: none; }
  .game h2 { margin: 0 0 2px; font-size: 1.2rem; }
  .game p { margin: 0 0 6px; color: var(--muted); }
  a { color: var(--red); }
  footer { margin-top: 32px; color: var(--muted); font-size: 0.95rem; }
</style>
</head>
<body>
<main>
<h1>Content Ease</h1>
<p class="lead">Games for Android phones and tablets.</p>

<div class="game">
  <img src="snakes-and-ladders/icon.png" alt="Snakes &amp; Ladders: Power Mode icon">
  <div>
    <h2>Snakes &amp; Ladders: Power Mode</h2>
    <p>The classic board game with power cards, an Adventure of 60 levels and collectable skins.</p>
    <a href="snakes-and-ladders/privacy-policy.html">Privacy policy</a>
  </div>
</div>

<footer>Contact: <a href="mailto:shoaibg4u@gmail.com">shoaibg4u@gmail.com</a></footer>
</main>
</body>
</html>
